# apiVersion: image.toolkit.fluxcd.io/v1
# kind: ImagePolicy
# metadata:
#   name: modernengineering
#   namespace: flux-system
# spec:
#   imageRepositoryRef:
#     name: modernengineering
#   filterTags:
#     pattern: '^main-[a-fA-F0-9]+-(?P<ts>.*)'
#     extract: '$ts'
#   policy:
#     numerical:
#       order: asc
# #---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: modernengineering
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: modernengineering
  filterTags:
    pattern: '^v(?P<semver>[0-9]*\.[0-9]*\.[0-9]*)'
    extract: '$semver'
  policy:
    semver:
      range: '>=1.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: modernengineering-alpha
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: modernengineering
  filterTags:
    pattern: '^v(?P<semver>[0-9]+\.[0-9]+\.[0-9]+-alpha[0-9A-Za-z.-]*)$'
    extract: '$semver'
  policy:
    semver:
      range: '>=0.0.1-0'
