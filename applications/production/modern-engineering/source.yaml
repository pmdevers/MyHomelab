apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: modernengineering
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: modernengineering
  path: ./deploy
  prune: true
  wait: true
  timeout: 5m0s
  images:
    - name: ghcr.io/modernengineering/website
      newName: ghcr.io/modernengineering/website # {"$imagepolicy": "flux-system:modernengineering-alpha:name"}
      newTag: v0.0.1-alpha002 # {"$imagepolicy": "flux-system:modernengineering-alpha:tag"}
